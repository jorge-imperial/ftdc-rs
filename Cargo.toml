[package]
name = "ftdc-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["parquet"]
parquet = ["dep:polars"]

[dependencies]
bson = "2.15.0"
zune-inflate = "0.2.54"
serde_json = "1.0.140"
clap = { version = "4.5.53", features = ["derive"] }
polars = { version = "0.49.1", optional = true, features = ["parquet", "polars-io"] }
env_logger = "0.11.8"
indexmap = "2"
thiserror = "2.0.12"
regex = "1.12.2"
log = "0.4"

[[bin]]
name = "ftdc-rs"
path = "src/main.rs"
required-features = ["parquet"]

[dev-dependencies]
flate2 = "1"
